<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังยาสมุนไพร - ระบบการจองแพทย์แผนไทย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <div id="sidebarContainer"></div>

        <div class="main-content">
            <div id="topbarContainer"></div>

            <div class="page-container">
                <div class="card" style="padding: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
                        <div>
                            <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--primary-dark);">💊 คลังยาสมุนไพรและอัปเดตสต็อก (Medicine Inventory)</h2>
                            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                                จัดการรายการยาสมุนไพร สรรพคุณ ราคา และปรับปรุงจำนวนคงเหลือในคลัง
                            </p>
                        </div>

                        <div style="display: flex; gap: 0.75rem; align-items: center;">
                            <input type="text" id="medicineSearchInput" oninput="filterMedicines()" placeholder="🔍 ค้นหาชื่อยา, รหัสยา..." style="padding: 0.55rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; min-width: 250px;">
                            <button class="btn-primary" onclick="openUpdateStockModal(1)">+ เพิ่มยาสมุนไพรใหม่</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="queue-table" style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #F9FAFB; border-bottom: 1px solid var(--border-color); text-align: left;">
                                    <th style="padding: 0.85rem 1rem;">รหัสยา (Code)</th>
                                    <th style="padding: 0.85rem 1rem;">ชื่อยาสมุนไพร</th>
                                    <th style="padding: 0.85rem 1rem;">สรรพคุณ / ตำรับยา</th>
                                    <th style="padding: 0.85rem 1rem;">ประเภท / หน่วย</th>
                                    <th style="padding: 0.85rem 1rem;">ราคา/หน่วย</th>
                                    <th style="padding: 0.85rem 1rem;">คงเหลือในคลัง</th>
                                    <th style="padding: 0.85rem 1rem; text-align: center;">จัดการสต็อก</th>
                                </tr>
                            </thead>
                            <tbody id="medicinesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Update Stock Modal -->
    <div id="updateStockModal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 480px;">
            <div class="modal-header">
                <h3 class="modal-title">💊 อัปเดตจำนวนคงเหลือในคลังยา</h3>
                <button class="btn-close-modal" onclick="closeUpdateStockModal()">✕</button>
            </div>
            <form id="updateStockForm" onsubmit="handleStockSubmit(event)">
                <div class="modal-body">
                    <input type="hidden" id="stockMedId">
                    <div style="background: var(--primary-subtle); padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.25rem;">
                        <div style="font-weight: 700; color: var(--primary-dark);" id="stockMedName">ยาลูกกลอนแก้ลมปัตฆาต</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);" id="stockMedCode">MED-001</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">ประเภทการปรับปรุงสต็อก</label>
                        <select id="stockActionType" class="form-select">
                            <option value="add">+ รับเข้าคลัง (Restock)</option>
                            <option value="subtract">- เบิกจ่าย / ตัดสต็อก</option>
                            <option value="set">= กำหนดจำนวนคงเหลือใหม่</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">จำนวน (Quantity)</label>
                        <input type="number" id="stockQuantityInput" class="form-input" min="1" value="20" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeUpdateStockModal()">ยกเลิก</button>
                    <button type="submit" class="btn-primary">บันทึกอัปเดตสต็อก</button>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let medicinesData = [
            { med_id: 1, code: "MED-001", name: "ยาลูกกลอนแก้ลมปัตฆาต", type: "ยาลูกกลอน", unit: "กระปุก (60 เม็ด)", properties: "บรรเทาอาการปวดกล้ามเนื้อ คอบ่าไหล่ กระจายลมปัตฆาต", price: 180.00, stock_qty: 8, reorder_level: 15 },
            { med_id: 2, code: "MED-002", name: "ยาหอมนวโกฐ", type: "ยาผง / ชงน้ำร้อน", unit: "ขวด (100 กรัม)", properties: "แก้ลมวิงเวียน ปรับธาตุลม บำรุงหัวใจ แก้อ่อนเพลีย", price: 250.00, stock_qty: 42, reorder_level: 10 },
            { med_id: 3, code: "MED-003", name: "น้ำมันไพลสดประคบกาย", type: "ยาทา / ถูนวด", unit: "ขวดแก้ว (60 ml)", properties: "ทาบรรเทาอาการเคล็ดขัดยอก ลดการอักเสบของกล้ามเนื้อและข้อ", price: 150.00, stock_qty: 3, reorder_level: 10 },
            { med_id: 4, code: "MED-004", name: "ยาต้มปรับสมดุลธาตุประจำฤดู", type: "ยาต้มสมุนไพรสด", unit: "ชุดสมุนไพรแห้ง", properties: "ปรับสมดุลธาตุดิน น้ำ ลม ไฟ ตามธาตุเจ้าเรือน", price: 320.00, stock_qty: 25, reorder_level: 10 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar('medicines');
            renderTopbar('คลังยา (Medicines)');
            renderMedicinesTable();
        });

        function renderMedicinesTable() {
            const tbody = document.getElementById('medicinesTableBody');
            tbody.innerHTML = '';
            const search = (document.getElementById('medicineSearchInput')?.value || '').toLowerCase().trim();

            const filtered = medicinesData.filter(m => m.name.toLowerCase().includes(search) || m.code.toLowerCase().includes(search));

            filtered.forEach(m => {
                const tr = document.createElement('tr');
                let stockBadge = m.stock_qty <= 5
                    ? `<span class="stock-badge stock-critical">⚠️ เหลือน้อยมาก (${m.stock_qty})</span>`
                    : (m.stock_qty <= m.reorder_level ? `<span class="stock-badge stock-low">⚠️ ต้องเติมสต็อก (${m.stock_qty})</span>` : `<span class="stock-badge stock-normal">✓ ปกติ (${m.stock_qty})</span>`);

                tr.innerHTML = `
                    <td style="padding: 1rem; font-weight: 700; color: var(--primary);">${m.code}</td>
                    <td style="padding: 1rem;"><b>${m.name}</b><br><small style="color:var(--text-tertiary);">${m.unit}</small></td>
                    <td style="padding: 1rem; font-size: 0.85rem; color: var(--text-secondary); max-width: 260px;">${m.properties}</td>
                    <td style="padding: 1rem; font-size: 0.85rem;">${m.type}</td>
                    <td style="padding: 1rem; font-weight: 600;">฿${m.price.toFixed(2)}</td>
                    <td style="padding: 1rem;">${stockBadge}</td>
                    <td style="padding: 1rem; text-align: center;">
                        <button class="btn-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" onclick="openUpdateStockModal(${m.med_id})">✏️ อัปเดตสต็อก</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterMedicines() { renderMedicinesTable(); }

        function openUpdateStockModal(id) {
            const med = medicinesData.find(m => m.med_id === id) || medicinesData[0];
            document.getElementById('stockMedId').value = med.med_id;
            document.getElementById('stockMedName').textContent = med.name;
            document.getElementById('stockMedCode').textContent = `${med.code} | คงเหลือปัจจุบัน: ${med.stock_qty} ${med.unit}`;
            document.getElementById('updateStockModal').style.display = 'flex';
        }

        function closeUpdateStockModal() { document.getElementById('updateStockModal').style.display = 'none'; }

        function handleStockSubmit(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('stockMedId').value);
            const action = document.getElementById('stockActionType').value;
            const qty = parseInt(document.getElementById('stockQuantityInput').value);

            const med = medicinesData.find(m => m.med_id === id);
            if (med) {
                if (action === 'add') med.stock_qty += qty;
                else if (action === 'subtract') med.stock_qty = Math.max(0, med.stock_qty - qty);
                else med.stock_qty = qty;

                renderMedicinesTable();
                closeUpdateStockModal();
                showToast(`🎉 อัปเดตสต็อกยา '${med.name}' เป็น ${med.stock_qty} เรียบร้อยแล้ว`);
            }
        }
    </script>
</body>
</html>
