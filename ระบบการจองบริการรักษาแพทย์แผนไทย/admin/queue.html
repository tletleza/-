<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการคิวการจอง - ระบบการจองแพทย์แผนไทย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <div id="sidebarContainer"></div>

        <div class="main-content">
            <div id="topbarContainer"></div>

            <div class="page-container">
                <div class="queue-header-toolbar">
                    <div>
                        <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--primary-dark);">📋 ระบบจัดการคิวการจอง (Queue Management)</h2>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                            ติดตามคิวประจำวัน เปลี่ยนสถานะการรักษา และลงทะเบียนจองหน้าร้าน (Walk-in)
                        </p>
                    </div>

                    <div style="display: flex; gap: 0.85rem; align-items: center;">
                        <div class="view-toggle-group">
                            <button class="view-toggle-btn active" id="btnViewTable" onclick="setQueueView('table')">☰ ตาราง (Table)</button>
                            <button class="view-toggle-btn" id="btnViewKanban" onclick="setQueueView('kanban')">📋 Kanban Board</button>
                        </div>
                        <button class="btn-primary" onclick="openWalkinModal()">+ เพิ่มการจองหน้าร้าน (Walk-in)</button>
                    </div>
                </div>

                <!-- Table View -->
                <div id="queueTableViewContainer" class="card" style="padding: 1.25rem;">
                    <div class="table-responsive">
                        <table class="queue-table" style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #F9FAFB; border-bottom: 1px solid var(--border-color); text-align: left;">
                                    <th style="padding: 0.85rem 1rem;">เวลาจอง</th>
                                    <th style="padding: 0.85rem 1rem;">ชื่อผู้ป่วย</th>
                                    <th style="padding: 0.85rem 1rem;">บริการ / หัตถการ</th>
                                    <th style="padding: 0.85rem 1rem;">ผู้ให้บริการ</th>
                                    <th style="padding: 0.85rem 1rem;">สถานะ</th>
                                    <th style="padding: 0.85rem 1rem; text-align: center;">จัดการสถานะ</th>
                                </tr>
                            </thead>
                            <tbody id="queueTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Kanban Board View -->
                <div id="kanbanBoardContainer" class="kanban-board" style="display: none;">
                    <div class="kanban-column">
                        <div class="kanban-col-header"><span class="kanban-col-title">⏳ รอรับบริการ</span><span class="kanban-col-count" id="countPending">0</span></div>
                        <div id="kanbanColPending"></div>
                    </div>
                    <div class="kanban-column">
                        <div class="kanban-col-header"><span class="kanban-col-title" style="color: #0284C7;">🔵 ยืนยันแล้ว</span><span class="kanban-col-count" id="countConfirmed">0</span></div>
                        <div id="kanbanColConfirmed"></div>
                    </div>
                    <div class="kanban-column">
                        <div class="kanban-col-header"><span class="kanban-col-title" style="color: #059669;">✅ เสร็จสิ้น</span><span class="kanban-col-count" id="countCompleted">0</span></div>
                        <div id="kanbanColCompleted"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Walk-in Booking Modal -->
    <div id="walkinModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">🏥 บันทึกการจองหน้าร้าน (Walk-in Booking)</h3>
                <button class="btn-close-modal" onclick="closeWalkinModal()">✕</button>
            </div>
            <form id="walkinForm" onsubmit="handleWalkinSubmit(event)">
                <div class="modal-body">
                    <div class="form-group"><label class="form-label">ชื่อ-นามสกุล ผู้ป่วย</label><input type="text" id="walkinPatientName" class="form-input" required placeholder="เช่น คุณสมพงษ์ ใจเย็น"></div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group"><label class="form-label">เบอร์โทรศัพท์</label><input type="tel" id="walkinPhone" class="form-input" required placeholder="081-XXX-XXXX"></div>
                        <div class="form-group">
                            <label class="form-label">ช่วงเวลาการรักษา</label>
                            <select id="walkinTimeSlot" class="form-select" required>
                                <option value="09:00 - 10:00 น.">09:00 - 10:00 น.</option>
                                <option value="10:00 - 11:30 น.">10:00 - 11:30 น.</option>
                                <option value="13:30 - 15:00 น.">13:30 - 15:00 น.</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">เลือกบริการ / หัตถการ</label>
                        <select id="walkinService" class="form-select">
                            <option value="นวดไทยราชสำนักแก้อาการ|60|850">นวดไทยราชสำนักแก้อาการ (60 นาที - ฿850.00)</option>
                            <option value="เผายาสมุนไพรหน้าท้อง + นวดแก้ลม|90|950">เผายาสมุนไพรหน้าท้อง + นวดแก้ลม (90 นาที - ฿950.00)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">เลือกผู้ให้บริการ</label>
                        <select id="walkinStaff" class="form-select">
                            <option value="พท.ว. สมชาย ใจดี|doctor">พท.ว. สมชาย ใจดี (แพทย์)</option>
                            <option value="นศ.พท. วรรณา สุขสันต์|intern">นศ.พท. วรรณา สุขสันต์ (ฝึกงาน)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeWalkinModal()">ยกเลิก</button>
                    <button type="submit" class="btn-primary">บันทึกการจอง Walk-in</button>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let currentMode = 'table';
        let bookingsData = [
            { booking_id: 101, booking_time: "09:00 - 10:00 น.", patient_name: "คุณสมศรี มีสุข", hn_number: "HN-001", service_name: "นวดไทยราชสำนักแก้อาการ", duration_minutes: 60, staff_name: "พท.ว. สมชาย ใจดี", staff_role: "doctor", status: "completed", total_price: 850.00 },
            { booking_id: 102, booking_time: "10:00 - 11:30 น.", patient_name: "คุณวิชัย เลิศพาณิชย์", hn_number: "HN-002", service_name: "เผายาสมุนไพรหน้าท้อง", duration_minutes: 90, staff_name: "นศ.พท. วรรณา สุขสันต์", staff_role: "intern", status: "confirmed", total_price: 950.00 },
            { booking_id: 103, booking_time: "11:30 - 12:30 น.", patient_name: "คุณอารียา กิจเจริญ", hn_number: "HN-003", service_name: "อบไอน้ำสมุนไพรสด", duration_minutes: 60, staff_name: "พท.น. ประเสริฐ ยิ้มแย้ม", staff_role: "doctor", status: "pending", total_price: 500.00 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar('queue');
            renderTopbar('จัดการคิว (Queue Management)');
            renderQueueView();
        });

        function setQueueView(mode) {
            currentMode = mode;
            document.getElementById('btnViewTable').classList.toggle('active', mode === 'table');
            document.getElementById('btnViewKanban').classList.toggle('active', mode === 'kanban');
            document.getElementById('queueTableViewContainer').style.display = mode === 'table' ? 'block' : 'none';
            document.getElementById('kanbanBoardContainer').style.display = mode === 'kanban' ? 'grid' : 'none';
            renderQueueView();
        }

        function renderQueueView() {
            if (currentMode === 'table') {
                const tbody = document.getElementById('queueTableBody');
                tbody.innerHTML = '';
                bookingsData.forEach(item => {
                    const tr = document.createElement('tr');
                    let statusHtml = item.status === 'completed'
                        ? `<span style="background: #D1FAE5; color: #065F46; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600;">✓ เสร็จสิ้น</span>`
                        : (item.status === 'confirmed' ? `<span style="background: #E0F2FE; color: #075985; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600;">🔵 ยืนยันแล้ว</span>` : `<span style="background: #FEF3C7; color: #92400E; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600;">⏳ รอรับบริการ</span>`);

                    let btnHtml = item.status === 'pending'
                        ? `<button class="btn-primary" style="background: #0284C7; padding: 0.35rem 0.75rem; font-size: 0.8rem;" onclick="updateStatus(${item.booking_id}, 'confirmed')">➔ ยืนยันคิว</button>`
                        : (item.status === 'confirmed' ? `<button class="btn-primary" style="background: #059669; padding: 0.35rem 0.75rem; font-size: 0.8rem;" onclick="updateStatus(${item.booking_id}, 'completed')">⚡ ทำรายการเสร็จสิ้น</button>` : `<button class="btn-primary" disabled style="opacity: 0.5; background: #9CA3AF; padding: 0.35rem 0.75rem; font-size: 0.8rem;">✓ เสร็จสิ้นเรียบร้อย</button>`);

                    tr.innerHTML = `
                        <td style="padding: 1rem; font-weight: 600;">${item.booking_time}</td>
                        <td style="padding: 1rem;"><b>${item.patient_name}</b><br><small style="color:var(--text-tertiary);">${item.hn_number}</small></td>
                        <td style="padding: 1rem;">${item.service_name}</td>
                        <td style="padding: 1rem;">${item.staff_name}</td>
                        <td style="padding: 1rem;">${statusHtml}</td>
                        <td style="padding: 1rem; text-align: center;">${btnHtml}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                const colPending = document.getElementById('kanbanColPending');
                const colConfirmed = document.getElementById('kanbanColConfirmed');
                const colCompleted = document.getElementById('kanbanColCompleted');
                colPending.innerHTML = ''; colConfirmed.innerHTML = ''; colCompleted.innerHTML = '';

                bookingsData.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'kanban-card';
                    card.innerHTML = `<span class="card-time-tag">${item.booking_time}</span><div class="card-patient-name">${item.patient_name}</div><div>${item.service_name}</div><small style="color:var(--text-secondary);">👤 ${item.staff_name}</small>`;
                    if (item.status === 'pending') colPending.appendChild(card);
                    else if (item.status === 'confirmed') colConfirmed.appendChild(card);
                    else colCompleted.appendChild(card);
                });
            }
        }

        function updateStatus(id, newStatus) {
            const item = bookingsData.find(b => b.booking_id === id);
            if (item) {
                item.status = newStatus;
                renderQueueView();
                showToast(`อัปเดตสถานะคิวคุณ ${item.patient_name} เรียบร้อยแล้ว`);
            }
        }

        function openWalkinModal() { document.getElementById('walkinModal').style.display = 'flex'; }
        function closeWalkinModal() { document.getElementById('walkinModal').style.display = 'none'; }
        function handleWalkinSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('walkinPatientName').value;
            bookingsData.push({
                booking_id: 100 + bookingsData.length + 1,
                booking_time: "14:00 - 15:00 น.",
                patient_name: name,
                hn_number: "HN-00" + (bookingsData.length + 1),
                service_name: "นวดไทยราชสำนักแก้อาการ",
                staff_name: "พท.ว. สมชาย ใจดี",
                staff_role: "doctor",
                status: "pending",
                total_price: 850.00
            });
            closeWalkinModal();
            renderQueueView();
            showToast(`🎉 บันทึกการจอง Walk-in คุณ ${name} เรียบร้อยแล้ว`);
        }
    </script>
</body>
</html>
