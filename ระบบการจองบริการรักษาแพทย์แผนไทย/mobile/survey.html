<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แบบประเมินความพึงพอใจ - Patient Mobile App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-device-frame">
        <div class="mobile-status-bar">
            <span>09:41</span>
            <div class="mobile-notch"></div>
            <span>📶 🔋 100%</span>
        </div>

        <div class="mobile-screen-body">
            <div class="app-bar-header">
                <a href="history.html" class="btn-back-icon" style="text-decoration: none; color: var(--text-main);">←</a>
                <div style="font-weight: 700; font-size: 1rem; color: var(--primary-dark);">แบบประเมินความพึงพอใจ</div>
                <div style="width: 40px;"></div>
            </div>

            <div class="screening-card" style="text-align: center;">
                <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🌿</div>
                <h2 class="question-title">ประเมินความพึงพอใจการรับบริการ</h2>
                <p class="question-desc">รอบการรักษา: 31 ก.ค. 2026 - นวดไทยราชสำนัก</p>

                <!-- Interactive 1-5 Star Rating -->
                <div class="star-rating-container" id="starRatingContainer">
                    <span class="star-rating-icon active" onclick="setRating(1)">★</span>
                    <span class="star-rating-icon active" onclick="setRating(2)">★</span>
                    <span class="star-rating-icon active" onclick="setRating(3)">★</span>
                    <span class="star-rating-icon active" onclick="setRating(4)">★</span>
                    <span class="star-rating-icon active" onclick="setRating(5)">★</span>
                </div>
                <div style="font-size: 0.88rem; font-weight: 700; color: #D97706; margin-bottom: 1.25rem;" id="starRatingLabel">ดีเยี่ยมมาก (5/5 ดาว)</div>

                <div style="text-align: left;">
                    <label class="input-label">ข้อเสนอแนะเพิ่มเติมเพื่อพัฒนาการบริการ:</label>
                    <textarea id="surveyText" class="survey-feedback-textarea" rows="4" placeholder="พิมพ์ความรู้สึก หรือ ข้อเสนอแนะเพิ่มเติมเกี่ยวกับคลินิกและการรักษา..."></textarea>
                </div>

                <button type="button" class="btn-mobile-submit" onclick="submitSurvey()">
                    <span>ส่งแบบประเมินความพึงพอใจ ➔</span>
                </button>
            </div>
        </div>

        <nav class="mobile-bottom-nav" id="mobileBottomNav"></nav>
    </div>

    <script src="common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderMobileBottomNav('history');
        });

        function setRating(rating) {
            const stars = document.querySelectorAll('.star-rating-icon');
            stars.forEach((star, i) => {
                star.classList.toggle('active', i < rating);
            });
            const labels = ["", "ปรับปรุง (1/5)", "พอใช้ (2/5)", "ปานกลาง (3/5)", "ดีมาก (4/5)", "ดีเยี่ยมมาก (5/5 ดาว)"];
            document.getElementById('starRatingLabel').textContent = labels[rating] || "";
        }

        function submitSurvey() {
            showMobileToast('💖 ขอบพระคุณสำหรับแบบประเมินความพึงพอใจ!');
            setTimeout(() => window.location.href = 'history.html', 800);
        }
    </script>
</body>
</html>
