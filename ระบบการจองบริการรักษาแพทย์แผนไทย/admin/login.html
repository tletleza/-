<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบบริหารจัดการคลินิกแพทย์แผนไทย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card fade-in">
            <div class="login-brand">
                <div class="login-brand-icon">พท</div>
                <h1 class="login-title">ระบบการจองแพทย์แผนไทย</h1>
                <p class="login-subtitle">ระบบบริหารจัดการสำหรับเจ้าหน้าที่และแพทย์</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">เข้าสู่ระบบในฐานะ (Role)</label>
                    <div class="role-selector">
                        <button type="button" class="role-btn active" onclick="selectRole('admin', this)">แอดมิน</button>
                        <button type="button" class="role-btn" onclick="selectRole('doctor', this)">แพทย์</button>
                        <button type="button" class="role-btn" onclick="selectRole('intern', this)">นักศึกษาฝึกงาน</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">ชื่อผู้ใช้งาน หรือ เบอร์โทรศัพท์</label>
                    <input type="text" id="usernameInput" class="form-input" value="admin_somchai" required placeholder="เช่น admin_somchai">
                </div>

                <div class="form-group">
                    <label class="form-label">รหัสผ่าน</label>
                    <input type="password" id="passwordInput" class="form-input" value="••••••••" required placeholder="กรอกรหัสผ่าน">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 1.5rem; width: 100%;">
                    <span>เข้าสู่ระบบ (Sign In)</span>
                    <span>➔</span>
                </button>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let currentSelectedRole = 'admin';

        function selectRole(role, btn) {
            currentSelectedRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('usernameInput').value;

            const userObj = {
                username: username,
                name: currentSelectedRole === 'doctor' ? 'พท.ว. สมชาย ใจดี' : (currentSelectedRole === 'intern' ? 'นศ.พท. วรรณา สุขสันต์' : 'ผู้ดูแลระบบ (Admin)'),
                role: currentSelectedRole,
                title: currentSelectedRole === 'intern' ? 'นักศึกษาฝึกงาน' : 'Administrator (พท.ว.)'
            };

            sessionStorage.setItem('ttm_user', JSON.stringify(userObj));
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
