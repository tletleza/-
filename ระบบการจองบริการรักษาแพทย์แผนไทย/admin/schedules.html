<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเวร - ระบบการจองแพทย์แผนไทย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <div id="sidebarContainer"></div>

        <div class="main-content">
            <div id="topbarContainer"></div>

            <div class="page-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>
                        <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--primary-dark);">📅 ตารางเวรและการจัดตารางแพทย์/นักศึกษาฝึกงาน (Doctor Schedules)</h2>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem;">
                            จัดเวรปฏิบัติงานประจำสัปดาห์ พร้อมแท็กแสดงความเชี่ยวชาญ (Specialty Badges) เพื่อจับคู่กับอาการผู้ป่วย
                        </p>
                    </div>
                    <button class="btn-primary" onclick="openAssignShiftModal()">+ จัดเวรปฏิบัติงานใหม่ (Assign Shift)</button>
                </div>

                <div class="schedules-grid" id="schedulesRosterGrid"></div>
            </div>
        </div>
    </div>

    <!-- Assign Shift Modal -->
    <div id="assignShiftModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">📅 จัดเวรปฏิบัติงานแพทย์ / นักศึกษาฝึกงาน</h3>
                <button class="btn-close-modal" onclick="closeAssignShiftModal()">✕</button>
            </div>
            <form id="assignShiftForm" onsubmit="handleAssignShiftSubmit(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">เลือกบุคลากร (Staff Member)</label>
                        <select id="shiftStaffSelect" class="form-select" required>
                            <option value="1">พท.ว. สมชาย ใจดี (เวชกรรมไทย / นวดราชสำนัก)</option>
                            <option value="2">พท.น. ประเสริฐ ยิ้มแย้ม (นวดแก้อาการ / ตดข้อดัดดอน)</option>
                            <option value="3">นศ.พท. วรรณา สุขสันต์ (ฝึกงาน - เผายาสมุนไพร)</option>
                        </select>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group"><label class="form-label">วันที่ออกเวร</label><input type="date" class="form-input" value="2026-08-01" required></div>
                        <div class="form-group"><label class="form-label">ช่วงเวลา</label><select class="form-select"><option>เวรเช้า (09:00 - 17:00 น.)</option></select></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeAssignShiftModal()">ยกเลิก</button>
                    <button type="submit" class="btn-primary">บันทึกเวรปฏิบัติงาน</button>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        let staffSchedulesData = [
            { id: 1, name: "พท.ว. สมชาย ใจดี", role: "doctor", license: "พท.ว. 12345", specialties: [{ name: "ออฟฟิศซินโดรม", class: "tag-office-syndrome" }, { name: "นวดราชสำนัก", class: "tag-massage" }], work_date: "2026-08-01", shift_time: "09:00 - 17:00 น.", status: "available", booked_slots: 3 },
            { id: 2, name: "พท.น. ประเสริฐ ยิ้มแย้ม", role: "doctor", license: "พท.น. 67890", specialties: [{ name: "ดัดดัดดอน/ตดข้อ", class: "tag-bone-setting" }, { name: "นวดแก้อาการ", class: "tag-massage" }], work_date: "2026-08-01", shift_time: "09:00 - 17:00 น.", status: "available", booked_slots: 1 },
            { id: 3, name: "นศ.พท. วรรณา สุขสันต์", role: "intern", license: "นักศึกษาฝึกงาน (ปี 4)", specialties: [{ name: "เผายาสมุนไพร", class: "tag-herbal-burn" }, { name: "ประคบสมุนไพร", class: "tag-massage" }], work_date: "2026-08-01", shift_time: "10:00 - 18:00 น.", status: "available", booked_slots: 2 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar('schedules');
            renderTopbar('ตารางเวร (Schedules)');
            renderSchedulesGrid();
        });

        function renderSchedulesGrid() {
            const grid = document.getElementById('schedulesRosterGrid');
            grid.innerHTML = '';
            staffSchedulesData.forEach(staff => {
                const card = document.createElement('div');
                card.className = 'staff-schedule-card';
                let specs = staff.specialties.map(s => `<span class="specialty-tag ${s.class}">✦ ${s.name}</span>`).join('');
                card.innerHTML = `
                    <div>
                        <div class="staff-card-header">
                            <div class="staff-avatar-lg">${staff.name.charAt(0)}</div>
                            <div>
                                <div class="staff-card-title">${staff.name}</div>
                                <div style="font-size: 0.78rem; color: var(--text-tertiary);">${staff.license}</div>
                            </div>
                        </div>
                        <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-top: 0.75rem;">ความเชี่ยวชาญเฉพาะทาง:</div>
                        <div class="specialties-container">${specs}</div>
                    </div>
                    <div class="shift-time-badge">
                        <span>🗓️ เวรปฏิบัติงาน: ${staff.shift_time}</span>
                        <span style="color: #059669;">● ว่าง (${staff.booked_slots} จอง)</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAssignShiftModal() { document.getElementById('assignShiftModal').style.display = 'flex'; }
        function closeAssignShiftModal() { document.getElementById('assignShiftModal').style.display = 'none'; }
        function handleAssignShiftSubmit(e) { e.preventDefault(); closeAssignShiftModal(); showToast('🎉 บันทึกการจัดเวรใหม่เรียบร้อยแล้ว'); }
    </script>
</body>
</html>
