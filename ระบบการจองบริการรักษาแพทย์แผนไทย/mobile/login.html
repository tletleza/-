<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ / ลงทะเบียน - Patient Mobile App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mobile-device-frame">
        <div class="mobile-status-bar">
            <span>09:41</span>
            <div class="mobile-notch"></div>
            <span>📶 🔋 100%</span>
        </div>

        <div class="mobile-screen-body">
            <div class="auth-brand-hero fade-in">
                <div class="auth-logo-badge">พท</div>
                <h1 class="auth-title">แพทย์แผนไทยดิลิเวอรี</h1>
                <p class="auth-subtitle">ระบบจองคิวตรวจรักษาและหัตถการสมุนไพร</p>
            </div>

            <div class="tab-segmented-control">
                <button type="button" class="tab-segmented-btn active" id="btnTabLogin" onclick="switchAuthTab('login')">เข้าสู่ระบบ (Login)</button>
                <button type="button" class="tab-segmented-btn" id="btnTabRegister" onclick="switchAuthTab('register')">ลงทะเบียน (KYC)</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="mobile-input-group">
                    <label class="input-label">เบอร์โทรศัพท์</label>
                    <input type="tel" id="loginPhone" class="mobile-input" required value="081-987-6543" placeholder="08X-XXX-XXXX">
                </div>
                <div class="mobile-input-group">
                    <label class="input-label">รหัสผ่าน</label>
                    <input type="password" id="loginPassword" class="mobile-input" required value="••••••••" placeholder="กรอกรหัสผ่าน">
                </div>
                <button type="submit" class="btn-mobile-submit">
                    <span>เข้าสู่ระบบ</span>
                    <span>➔</span>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" style="display: none;" onsubmit="handleRegisterSubmit(event)">
                <div class="mobile-input-group">
                    <label class="input-label">ชื่อ-นามสกุล (ตามบัตรประชาชน)</label>
                    <input type="text" id="regName" class="mobile-input" required placeholder="เช่น คุณสมพงษ์ ใจดี">
                </div>
                <div class="mobile-input-group">
                    <label class="input-label">เบอร์โทรศัพท์</label>
                    <input type="tel" id="regPhone" class="mobile-input" required placeholder="08X-XXX-XXXX">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div class="mobile-input-group">
                        <label class="input-label">วันเกิด</label>
                        <input type="date" id="regDob" class="mobile-input" value="1992-05-15" required>
                    </div>
                    <div class="mobile-input-group">
                        <label class="input-label">ธาตุเจ้าเรือนกำเนิด</label>
                        <select id="regElement" class="mobile-input">
                            <option value="ดิน">ธาตุดิน</option><option value="น้ำ">ธาตุน้ำ</option><option value="ลม">ธาตุลม</option><option value="ไฟ">ธาตุไฟ</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-mobile-submit">
                    <span>ลงทะเบียนผู้ป่วยใหม่</span>
                    <span>➔</span>
                </button>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        function switchAuthTab(tab) {
            document.getElementById('btnTabLogin').classList.toggle('active', tab === 'login');
            document.getElementById('btnTabRegister').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            showMobileToast('เข้าสู่ระบบสำเร็จ!');
            setTimeout(() => window.location.href = 'screening.html', 500);
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const elem = document.getElementById('regElement').value;
            showMobileToast(`🎉 ลงทะเบียนสำเร็จ! วิเคราะห์ธาตุประจำตัว: ธาตุ${elem}`);
            setTimeout(() => window.location.href = 'screening.html', 800);
        }
    </script>
</body>
</html>
